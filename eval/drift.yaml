# Weekly drift check (yla eval drift). See src/yla/eval/drift.py.
# The primary model is re-run on the videos this run answered and compared with it.
reference_run: 20261013-nemotron-3-super-120b-a12b
# Runs of the same model, prompt and rules. On every check the thresholds are computed from these
# pairs: for F1 and for precision, the largest 95% CI bound of their difference. Add pairs as new A/A
# runs are made; the thresholds are provisional until there are more.
aa_pairs:
  - [20261013-nemotron-3-super-120b-a12b, 20261014-nemotron-3-super-120b-a12b]
  - [20261013-nemotron-3-super-120b-a12b, 20261015-nemotron-3-super-120b-a12b]
  - [20261014-nemotron-3-super-120b-a12b, 20261015-nemotron-3-super-120b-a12b]
