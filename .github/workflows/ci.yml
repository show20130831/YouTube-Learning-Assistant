name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yla
          POSTGRES_PASSWORD: yla
          POSTGRES_DB: yla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yla -d yla"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://yla:yla@localhost:5432/yla
      TEST_DATABASE_URL: postgresql+psycopg://yla:yla@localhost:5432/yla_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest --cov --cov-report=term-missing
