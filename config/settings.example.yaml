# Copy this file to config/settings.yaml and edit it. config/settings.yaml is git-ignored.
# Credentials (API keys, LINE user ID) go in .env, not here.

user:
  timezone: Asia/Taipei
  notify_time: "12:00"      # informational in v1; the actual time is set by the Modal cron
  daily_video_limit: 5      # keep low: OpenRouter free models allow ~50 requests/day
  include_shorts: false
  defer_max_days: 3

# channel_id is the UC... ID from the channel URL (youtube.com/channel/UC...).
# Channels without it are skipped until automatic handle lookup is added.
channels:
  - handle: DeepLearningAI
    channel_id: UCcIXc5mJsHVYTZR1maL5l9w
  - handle: LangChain
    channel_id: UCC-lyoTfSrcJzA1ab3APAgw
  - handle: AssemblyAI
    channel_id: UCtatfZMf-8EkIwASXM4ts0A
  - handle: AndrejKarpathy
    channel_id: UCXUPKJO5MZQN11PqgIvyuvQ
  - handle: statquest
    channel_id: UCtYLUTtgS3k1Fg4y5tAhLbw

topics:
  - name: AI Agent
    aliases: [Agents, Agentic AI, AI Agents]
  - name: LLM
    aliases: [Large Language Model, Large Language Models]
  - name: RAG
    aliases: [Retrieval-Augmented Generation, Retrieval Augmented Generation]
  - name: LangChain
  - name: LangGraph
  - name: FastAPI
  - name: Data Engineering
  - name: Machine Learning
    aliases: [ML]
  - name: Bioinformatics

content:
  min_description_chars: 150
  long_video_threshold_minutes: 120
  max_chunks: 6

llm:
  # Free long-context models with JSON-schema output (https://openrouter.ai/models?max_price=0).
  # The free list changes over time; tried in order until one answers.
  primary_model: nvidia/nemotron-3-super-120b-a12b:free
  fallback_models:
    - google/gemma-4-31b-it:free
    - openrouter/free
