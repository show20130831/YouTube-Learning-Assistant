[project]
name = "youtube-learning-assistant"
version = "0.1.0"
description = "Daily AI-generated study digests of new YouTube videos, delivered via LINE."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "typer>=0.12",
    "tzdata>=2024.1",
    "youtube-transcript-api>=1.2",
]

[project.scripts]
yla = "yla.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yla"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
# Full-width punctuation is intended in Traditional Chinese user-facing text.
allowed-confusables = ["，", "：", "；", "（", "）", "｜"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/yla", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs a Postgres database (docker compose up -d)"]

[tool.coverage.run]
source = ["yla"]
branch = true
